<div class="offcanvas offcanvas-end" tabindex="-1" id="library-filter-panel">

  <div class="offcanvas-header">
    <h2 class="offcanvas-title">
      <i class="ti ti-filter me-2"></i>Filters</h2>

    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

  <div id="library-filter-content" class="offcanvas-body"></div>

  <div class="filter-footer">
    <button id="filter-reset" class="btn btn-outline-secondary" disabled><i class="ti ti-restore me-1"></i>Reset</button>

    <button id="filter-apply" class="btn btn-primary" disabled><i class="ti ti-check me-1"></i>Apply Filters</button>
  </div>

</div>
