<div class="offcanvas offcanvas-end" tabindex="-1" id="sync-offcanvas" style="width: 520px">
  <div class="offcanvas-header">
    <h2 class="offcanvas-title">
      <i class="ti ti-refresh me-2"></i>
      Synchronization
    </h2>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body d-flex flex-column">
    <!-- ========================================================= -->
    <!-- Configuration -->
    <!-- ========================================================= -->
    <div id="sync-config-view">
      <div class="mb-4">
        <div class="row g-3 align-items-end">
          <!-- Source -->
          <div class="col-6">
            <label class="form-label">Source</label>

            <div class="form-selectgroup d-flex flex-wrap p-0 m-0">
              <label class="form-selectgroup-item w-50 p-0 m-0">
                <input type="radio" name="sync-source" value="local" class="form-selectgroup-input" checked />
                <span class="form-selectgroup-label d-flex rounded-0 ps-5">
                  Local
                  <i class="fs-2 ti ti-file me-2"></i>
                </span>
              </label>

              <label class="form-selectgroup-item w-50 p-0 m-0">
                <input type="radio" name="sync-source" value="online" class="form-selectgroup-input" />
                <span class="form-selectgroup-label d-flex rounded-0">
                  <i class="fs-2 ti ti-world me-2"></i>
                  Online
                </span>
              </label>
            </div>
          </div>

          <!-- Mode -->
          <div class="col-6">
            <label class="form-label">Mode</label>

            <select class="form-select" id="sync-mode">
              <option value="fill_missing">Fill Missing</option>
              <option value="overwrite">Overwrite</option>
              <option value="skip_existing">Skip Existing</option>
              <option value="only_changed">Only Changed</option>
            </select>
          </div>
        </div>
      </div>
      <!-- ========================================================= -->
      <!-- Metadata -->
      <!-- ========================================================= -->

      <div class="card mb-3">
        <div class="card-header d-flex align-items-center justify-content-between">
          <h3 class="card-title mb-0">Metadata</h3>
          <input type="checkbox" id="metadata-toggle" class="d-none" />
          <label
            for="metadata-toggle"
            class="fs-1 cursor-pointer user-select-none"
            data-bs-toggle="tooltip"
            title="Select All">
            <i id="metadata-toggle-icon" class="ti ti-select-all"></i>
          </label>
        </div>

        <div class="card-body">
          <div id="sync-metadata">
            <!-- generated by sync.js -->
          </div>
        </div>
      </div>

      <!-- ========================================================= -->
      <!-- Options -->
      <!-- ========================================================= -->

      <div class="card mb-3">
        <div class="card-header"><h3 class="card-title mb-0">Options</h3></div>

        <div class="card-body">
          <label class="form-check">
            <input class="form-check-input" id="sync-dry-run" type="checkbox" />
            <span class="form-check-label">Dry Run</span>
          </label>

          <label class="form-check mt-2">
            <input class="form-check-input" id="sync-force" type="checkbox" />
            <span class="form-check-label">Force</span>
          </label>
        </div>
      </div>
    </div>
    <!-- ========================================================= -->
    <!-- Progress -->
    <!-- ========================================================= -->
    <div id="sync-progress-view" class="d-none sync-progress-view">
      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div>
            <div class="fw-bold">Synchronizing novels</div>
            <div class="text-muted small" id="sync-progress-count">0 / 0</div>
          </div>

          <span class="badge bg-blue-lt" id="sync-progress-percent">0%</span>
        </div>

        <div class="progress">
          <div id="sync-progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
      </div>

      <!-- Current novel -->

      <div class="card mb-3">
        <div class="card-body">
          <div class="d-flex align-items-center mb-3">
            <div class="flex-fill min-width-0">
              <div class="fw-bold text-truncate" id="sync-current-novel">Waiting...</div>
              <div class="text-muted small" id="sync-current-status">Preparing synchronization</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Live counters -->

      <div class="card">
        <div class="card-header">
          <h3 class="card-title mb-0">Results</h3>
        </div>

        <div class="card-body">
          <div class="row text-center">
            <div class="col-6 col-sm-3">
              <div class="h2 mb-0" id="sync-count-updated">0</div>
              <div class="text-muted small">Updated</div>
            </div>

            <div class="col-6 col-sm-3">
              <div class="h2 mb-0" id="sync-count-skipped">0</div>
              <div class="text-muted small">Skipped</div>
            </div>

            <div class="col-6 col-sm-3">
              <div class="h2 mb-0" id="sync-count-warnings">0</div>
              <div class="text-muted small">Warnings</div>
            </div>

            <div class="col-6 col-sm-3">
              <div class="h2 mb-0" id="sync-count-errors">0</div>
              <div class="text-muted small">Errors</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- ========================================================= -->
    <!-- Result -->
    <!-- ========================================================= -->
    <div id="sync-result-view" class="d-none">
      <div class="text-center mb-4">
        <div class="avatar avatar-xl bg-success-lt mb-3">
          <i id="sync-result-icon" class="ti ti-check fs-1"></i>
        </div>

        <h2 id="sync-result-title">Synchronization Complete</h2>

        <div class="text-muted" id="sync-result-message">Synchronization finished.</div>
      </div>

      <!-- Summary -->

      <div class="card mb-3">
        <div class="card-header">
          <h3 class="card-title mb-0">Summary</h3>
        </div>

        <div class="card-body">
          <div class="row text-center">
            <div class="col-6 mb-3">
              <div class="h2 mb-0" id="sync-result-total">0</div>
              <div class="text-muted">Processed</div>
            </div>

            <div class="col-6 mb-3">
              <div class="h2 mb-0" id="sync-result-updated">0</div>
              <div class="text-muted">Updated</div>
            </div>

            <div class="col-6">
              <div class="h2 mb-0" id="sync-result-skipped">0</div>
              <div class="text-muted">Skipped</div>
            </div>

            <div class="col-6">
              <div class="h2 mb-0" id="sync-result-errors">0</div>
              <div class="text-muted">Errors</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Problems -->

      <div id="sync-result-problems" class="d-none">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title mb-0">Problems</h3>
          </div>

          <div class="list-group list-group-flush" id="sync-result-problem-list"></div>
        </div>
      </div>
    </div>
    <!-- ========================================================= -->
    <!-- Live logs -->
    <!-- ========================================================= -->
    <div id="sync-live-log" class="card mt-3 d-none">
      <div class="card-header d-flex align-items-center justify-content-between">
        <h3 class="card-title mb-0">
          <i class="ti ti-terminal-2 me-2"></i>
          Live Log
        </h3>

        <button type="button" class="btn btn-sm btn-ghost-secondary" id="sync-log-clear">
          <i class="ti ti-trash"></i>
        </button>
      </div>

      <div id="sync-log-container" class="card-body p-0">
        <div id="sync-log-list" class="p-3"></div>
      </div>
    </div>
  </div>

  <div class="offcanvas-footer p-3 border-top">
    <!-- Configuration footer -->

    <div id="sync-config-footer" class="d-flex justify-content-end gap-2">
      <button class="btn" data-bs-dismiss="offcanvas">Cancel</button>

      <button id="sync-start" class="btn btn-primary">
        <i class="ti ti-refresh me-1"></i>
        Synchronize
      </button>
    </div>

    <!-- Progress footer -->

    <div id="sync-progress-footer" class="d-none d-flex justify-content-end gap-2">
      <button id="sync-cancel" class="btn btn-danger">
        <i class="ti ti-player-stop me-1"></i>
        Cancel Synchronization
      </button>
    </div>

    <!-- Result footer -->

    <div id="sync-result-footer" class="d-none d-flex justify-content-end">
      <button id="sync-done" class="btn btn-primary" data-bs-dismiss="offcanvas">
        <i class="ti ti-check me-1"></i>
        Done
      </button>
    </div>
  </div>
</div>
