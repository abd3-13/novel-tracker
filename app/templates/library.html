<!doctype html>
<html class="dark" data-bs-theme="dark">
  <head>
    <title>Novel Tracker</title>
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/tabler/tabler.min.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/tabler/tabler-icons.min.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/library/ui.css') }}" />
    <script type="module" src="{{ url_for('static', filename='js/notifi.js') }}"></script>
  </head>
  <body>
    <div class="page-wrapper">
      <!-- Page Header -->
      <div class="page-header d-print-none library-header-sticky mt-0">
        <div class="container-xl">
          <div id="library-header" class="mb-4"></div>
          <div id="library-toolbar" class="mb-4"></div>
        </div>
      </div>
      <!-- Page Body -->
      <div class="page-body">
        <div class="container-md">
          <!-- Toolbar -->

          <!-- Active Filters -->
          <div id="library-filters" class="mb-3"></div>
          <!-- Main Content -->

          <div id="library-content">
            <!-- Grid Renderer inserts here -->
          </div>
        </div>
      </div>
    </div>
    <div id="library-overlays">{% include "overlays/sync.html" %} {% include "overlays/filter.html" %}</div>
    <div
      id="notification-container"
      class="position-fixed bottom-0 end-0 p-3"
      style="z-index: 1080; width: 380px"></div>
    <script src="{{ url_for('static', filename='vendor/tabler/tabler.min.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/library/app.js') }}"></script>
    <script>
      /* eslint-disable */
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          showNotification("{{ message|safe }}", "{{ category }}");
        {% endfor %}
        {% endwith %}
      /* eslint-enable */
    </script>
  </body>
</html>
