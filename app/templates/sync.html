<div class="offcanvas offcanvas-end"
     tabindex="-1"
     id="sync-offcanvas"
     style="width:520px;">

  <div class="offcanvas-header">
    <h2 class="offcanvas-title">
      <i class="ti ti-refresh me-2"></i>
      Synchronization
    </h2>

    <button type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body">

    <!-- ========================================================= -->
    <!-- Source -->
    <!-- ========================================================= -->

    <div class="card mb-3">

      <div class="card-header">
        <h3 class="card-title mb-0">Source</h3>
      </div>

      <div class="card-body">

        <label class="form-check">
          <input class="form-check-input"
                 type="radio"
                 name="sync-source"
                 value="local">

          <span class="form-check-label">
            Local EPUB
          </span>
        </label>

        <label class="form-check mt-2">
          <input class="form-check-input"
                 type="radio"
                 name="sync-source"
                 value="online"
                 checked>

          <span class="form-check-label">
            Online
          </span>
        </label>

      </div>

    </div>

    <!-- ========================================================= -->
    <!-- Mode -->
    <!-- ========================================================= -->

    <div class="card mb-3">

      <div class="card-header">
        <h3 class="card-title mb-0">Mode</h3>
      </div>

      <div class="card-body">

        <label class="form-check">
          <input class="form-check-input"
                 type="radio"
                 name="sync-mode"
                 value="fill_missing"
                 checked>

          <span class="form-check-label">
            Fill Missing
          </span>
        </label>

        <label class="form-check mt-2">
          <input class="form-check-input"
                 type="radio"
                 name="sync-mode"
                 value="overwrite">

          <span class="form-check-label">
            Overwrite
          </span>
        </label>

        <label class="form-check mt-2">
          <input class="form-check-input"
                 type="radio"
                 name="sync-mode"
                 value="skip_existing">

          <span class="form-check-label">
            Skip Existing
          </span>
        </label>

        <label class="form-check mt-2">
          <input class="form-check-input"
                 type="radio"
                 name="sync-mode"
                 value="only_changed">

          <span class="form-check-label">
            Only Changed
          </span>
        </label>

      </div>

    </div>

    <!-- ========================================================= -->
    <!-- Metadata -->
    <!-- ========================================================= -->

    <div class="card mb-3">

      <div class="card-header">
        <h3 class="card-title mb-0">Metadata</h3>
      </div>

      <div class="card-body">

        <div id="sync-metadata">

          <!-- generated by sync.js -->

        </div>

      </div>

    </div>

    <!-- ========================================================= -->
    <!-- Options -->
    <!-- ========================================================= -->

    <div class="card mb-3">

      <div class="card-header">
        <h3 class="card-title mb-0">Options</h3>
      </div>

      <div class="card-body">

        <label class="form-check">

          <input class="form-check-input"
                 id="sync-dry-run"
                 type="checkbox">

          <span class="form-check-label">
            Dry Run
          </span>

        </label>

        <label class="form-check mt-2">

          <input class="form-check-input"
                 id="sync-force"
                 type="checkbox">

          <span class="form-check-label">
            Force
          </span>

        </label>

      </div>

    </div>

    <!-- ========================================================= -->
    <!-- Summary -->
    <!-- ========================================================= -->

    <div class="card">

      <div class="card-header">
        <h3 class="card-title mb-0">Summary</h3>
      </div>

      <div class="card-body">

        <table class="table table-sm table-borderless mb-0">

          <tr>
            <td>Source</td>
            <td id="sync-summary-source">Online</td>
          </tr>

          <tr>
            <td>Mode</td>
            <td id="sync-summary-mode">Fill Missing</td>
          </tr>

          <tr>
            <td>Fields</td>
            <td id="sync-summary-fields">0</td>
          </tr>

        </table>

      </div>

    </div>

  </div>

  <div class="offcanvas-footer p-3 border-top">

    <div class="d-flex justify-content-end gap-2">

      <button class="btn"
              data-bs-dismiss="offcanvas">
        Cancel
      </button>

      <button id="sync-start"
              class="btn btn-primary">

        <i class="ti ti-refresh me-1"></i>

        Synchronize

      </button>

    </div>

  </div>

</div>
